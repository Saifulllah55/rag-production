readme = "README.md"
authors = [
    { email = "Saifulllah55" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.24",
    "llama-index-readers-file>=0.7.0",
